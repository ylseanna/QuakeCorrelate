[build-system]
requires = [
    "setuptools>=61.0",
    "juliacall",
    "juliapkg",
    "matplotlib",
    "numpy",
    "obspy",
    "scipy",
    "pandas",
    "dotenv",
    "zarr[zstd]",
]
build-backend = "setuptools.build_meta"

[project]
name = "quakecorrelate"
authors = [
    { name = "Ylse Anna de Vries", email = "yad2@hi.is" },
    { name = "Gabriele Benedetti", email = "gab28@hi.is" },
]
description = "GPU-powered earthquake correlation code"
readme = "README.md"
requires-python = ">=3.11.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Operating System :: POSIX :: Linux",
]
license="GPL-3.0"
license-files = ["LICEN[CS]E*"]

dynamic = ['version']

[project.urls]
Homepage = "https://github.com/ylseanna/QuakeCorrelate"
Issues = "https://github.com/ylseanna/QuakeCorrelate/issues"

[tool.setuptools.dynamic]
version = { attr = 'quakecorrelate.__version__' }

[tool.setuptools.packages.find]
include = ['quakecorrelate', 'quakecorrelate.*']

# [tool.setuptools.package-data]
